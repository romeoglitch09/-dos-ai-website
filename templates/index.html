<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOS AI PORTAL</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: 40px auto; 
            padding: 20px; 
            /* 🌆 BACKGROUND CONFIGURATION */
            background-image: url("{{ url_for('static', filename='Black White Cute Simple Y2K Logo-3.jpg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
        .main-card {
            background-color: rgba(255, 255, 255, 0.92);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            margin-bottom: 15px;
        }
        textarea { 
            width: 100%; 
            height: 80px; 
            margin-bottom: 10px; 
            padding: 10px; 
            border-radius: 4px; 
            border: 1px solid #ccc; 
            box-sizing: border-box; 
            font-size: 16px; 
        }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .response-box { background-color: #f8f9fa; border-left: 4px solid #007bff; padding: 15px; margin-top: 20px; white-space: pre-wrap; }
        
        /* 📐 BOTTOM RIGHT PAGE BLOCK POSITIONING: */
        .copyright-container {
            text-align: right;
            font-size: 12px;
            color: #ffffff;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
            padding-right: 5px;
        }
    </style>
</head>
<body>
    <div class="main-card">
        <h1>AI DOS SEARCH WITH GEMINI</h1>
        
        <form action="/ask-ai" method="POST">
            <!-- ⌨️ Attached specific ID variable matching script configuration -->
            <textarea id="search-box" name="message" placeholder="Don't complicate your search, the page will crash." required></textarea>
            <button type="submit">Let's find out!</button>
        </form>

        {% if reply %}
            <div class="response-box">
                <strong>{{ ai_name if ai_name else "DOS AI Response" }}:</strong>
                <p>{{ reply }}</p>
            </div>
        {% endif %}
    </div>

    <!-- 🌟 Copyright Info Positioned Directly Underneath Content Row -->
    <div class="copyright-container">
        &copy; 2026 Romualdo C. Yatco II. All Rights Reserved.
    </div>

    <!-- ⌨️ PRESS ENTER TO SUBMIT SCRIPT -->
    <script>
        const inputField = document.getElementById('search-box');
        
        if (inputField) {
            inputField.addEventListener('keydown', function(e) {
                // Submit instantly when pressing enter key alone
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault(); 
                    this.form.submit(); 
                }
            });
        }
    </script>
</body>
</html>
